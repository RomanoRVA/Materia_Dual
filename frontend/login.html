<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | POS Los Pachecos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --tomato: #cf3f2f;
        --chipotle: #29140f;
        --maize: #f5b73b;
        --smoke: #3f312c;
        --ok: #1f8a52;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        color: var(--smoke);
        background:
          radial-gradient(circle at 0% 0%, #ffd28f 0%, transparent 42%),
          radial-gradient(circle at 100% 0%, #ffad7e 0%, transparent 38%),
          linear-gradient(160deg, #fff9ef 0%, #ffe8ce 48%, #fdd4b6 100%);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .card {
        width: min(500px, 100%);
        background: #fff;
        border: 1px solid #f5d8c0;
        border-radius: 18px;
        padding: 22px;
        box-shadow: 0 10px 26px rgba(82, 37, 20, 0.14);
      }

      h1 {
        margin: 0;
        font-family: "Bebas Neue", sans-serif;
        letter-spacing: 1px;
        font-size: 2rem;
        color: var(--chipotle);
      }

      p {
        margin: 8px 0 16px;
      }

      label {
        font-size: 0.9rem;
        font-weight: 600;
      }

      input,
      button {
        font-family: inherit;
      }

      .access-code-box {
        width: 100%;
        border: 1px solid #ead3bf;
        border-radius: 12px;
        background: #fffdf9;
        font-size: 1.3rem;
        text-align: center;
        letter-spacing: 4px;
        padding: 10px;
        margin-top: 8px;
      }

      .numpad {
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 12px;
        cursor: pointer;
        background: var(--tomato);
        color: #fff;
        font-weight: 700;
      }

      button.secondary {
        background: #fff;
        color: var(--chipotle);
        border: 1px solid #d6b39a;
      }

      .status {
        margin-top: 12px;
        font-size: 0.92rem;
      }

      .status.ok {
        color: var(--ok);
      }

      .status.error {
        color: #b02b2b;
      }

      .server-pill {
        margin-top: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid #e6c9b2;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.85rem;
        background: #fffaf5;
      }

      .server-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #b02b2b;
      }

      .server-dot.ok {
        background: var(--ok);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>POS LOS PACHECOS</h1>
      <p>Acceso con combinacion numerica</p>

      <label for="accessCode">Codigo de acceso</label>
      <input
        id="accessCode"
        class="access-code-box"
        type="password"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="8"
        placeholder="Ejemplo: 100540"
      />

      <div class="numpad" id="numpad">
        <button type="button" data-key="1">1</button>
        <button type="button" data-key="2">2</button>
        <button type="button" data-key="3">3</button>
        <button type="button" data-key="4">4</button>
        <button type="button" data-key="5">5</button>
        <button type="button" data-key="6">6</button>
        <button type="button" data-key="7">7</button>
        <button type="button" data-key="8">8</button>
        <button type="button" data-key="9">9</button>
        <button type="button" id="clearCodeBtn" class="secondary">Limpiar</button>
        <button type="button" data-key="0">0</button>
        <button type="button" id="backspaceCodeBtn" class="secondary">Borrar</button>
      </div>

      <div style="margin-top: 10px">
        <button id="loginBtn" style="width: 100%">Ingresar</button>
      </div>
      <div style="margin-top: 8px">
        <button id="recoverCodeBtn" class="secondary" style="width: 100%">Recuperar codigo</button>
      </div>

      <div class="server-pill" id="serverPill">
        <span class="server-dot" id="serverDot"></span>
        <span id="serverStatusText">Servidor: verificando...</span>
      </div>

      <div id="authStatus" class="status">Sin autenticar.</div>
    </main>

    <script>
      const API_URL = 'http://localhost:3000';
      const refs = {
        accessCode: document.getElementById('accessCode'),
        numpad: document.getElementById('numpad'),
        clearCodeBtn: document.getElementById('clearCodeBtn'),
        backspaceCodeBtn: document.getElementById('backspaceCodeBtn'),
        loginBtn: document.getElementById('loginBtn'),
        recoverCodeBtn: document.getElementById('recoverCodeBtn'),
        serverPill: document.getElementById('serverPill'),
        serverDot: document.getElementById('serverDot'),
        serverStatusText: document.getElementById('serverStatusText'),
        authStatus: document.getElementById('authStatus'),
      };

      let serverOnline = false;

      function getDeviceId() {
        const existing = localStorage.getItem('posDeviceId');
        if (existing) {
          return existing;
        }

        const next = `web-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        localStorage.setItem('posDeviceId', next);
        return next;
      }

      function getDeviceName() {
        return navigator.userAgent.includes('Electron') ? 'POS Escritorio' : 'POS Navegador';
      }

      function ordersUrl() {
        return `./orders.html?v=${Date.now()}`;
      }

      function setStatus(message, isError = false) {
        refs.authStatus.textContent = message;
        refs.authStatus.classList.toggle('error', isError);
        refs.authStatus.classList.toggle('ok', !isError);
      }

      function sanitizeAccessCode(value) {
        return String(value || '')
          .replace(/\D/g, '')
          .slice(0, 8);
      }

      function appendAccessDigit(digit) {
        refs.accessCode.value = sanitizeAccessCode(`${refs.accessCode.value}${digit}`);
      }

      async function login() {
        if (!serverOnline) {
          setStatus('Servidor desconectado. Espera reconexion para iniciar sesion.', true);
          return;
        }

        const accessCode = sanitizeAccessCode(refs.accessCode.value);

        if (accessCode.length < 4) {
          setStatus('Ingresa un codigo valido de 4 a 8 digitos.', true);
          return;
        }

        try {
          const response = await fetch(`${API_URL}/api/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              accessCode,
              deviceId: getDeviceId(),
              deviceName: getDeviceName(),
            }),
          });

          const data = await response.json();
          if (!response.ok) {
            setStatus(data.message || 'Error de autenticacion.', true);
            return;
          }

          localStorage.setItem(
            'posSession',
            JSON.stringify({
              token: data.token,
              refreshToken: data.refreshToken,
              expiresAt: data.expiresAt,
              refreshExpiresAt: data.refreshExpiresAt,
              sessionId: data.sessionId,
              device: data.device,
              user: data.user,
            }),
          );
          setStatus(`Sesion activa: ${data.user.name}`);
          setTimeout(() => {
            window.location.href = ordersUrl();
          }, 300);
        } catch (error) {
          setStatus('No fue posible conectar con el backend.', true);
        }
      }

      async function recoverCode() {
        if (!serverOnline) {
          setStatus('Servidor desconectado. No se puede recuperar codigo.', true);
          return;
        }

        const username = window.prompt('Usuario a recuperar');
        if (!username) {
          return;
        }

        try {
          const requestResponse = await fetch(`${API_URL}/api/auth/password-reset/request`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username.trim() }),
          });
          const requestData = await requestResponse.json();

          if (!requestResponse.ok) {
            setStatus(requestData.message || 'No fue posible solicitar recuperacion.', true);
            return;
          }

          const resetToken = requestData.resetToken || window.prompt('Token de recuperacion');
          if (!resetToken) {
            setStatus(requestData.message || 'Solicitud de recuperacion generada.');
            return;
          }

          const accessCode = sanitizeAccessCode(window.prompt('Nuevo codigo numerico de 4 a 8 digitos') || '');
          if (accessCode.length < 4) {
            setStatus('Codigo nuevo invalido.', true);
            return;
          }

          const confirmResponse = await fetch(`${API_URL}/api/auth/password-reset/confirm`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ resetToken, accessCode }),
          });
          const confirmData = await confirmResponse.json();

          if (!confirmResponse.ok) {
            setStatus(confirmData.message || 'No fue posible cambiar el codigo.', true);
            return;
          }

          refs.accessCode.value = '';
          setStatus(confirmData.message || 'Codigo actualizado.');
        } catch (error) {
          setStatus('Error de comunicacion al recuperar codigo.', true);
        }
      }

      async function checkBackendHealth() {
        try {
          const response = await fetch(`${API_URL}/health`, {
            method: 'GET',
            cache: 'no-store',
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          serverOnline = true;
          refs.serverDot.classList.add('ok');
          refs.serverStatusText.textContent = 'Servidor: conectado';
          refs.loginBtn.disabled = false;
        } catch (error) {
          serverOnline = false;
          refs.serverDot.classList.remove('ok');
          refs.serverStatusText.textContent = 'Servidor: desconectado';
          refs.loginBtn.disabled = true;
        }
      }

      refs.numpad.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-key]');
        if (!button) {
          return;
        }

        appendAccessDigit(button.getAttribute('data-key'));
      });

      refs.accessCode.addEventListener('input', () => {
        refs.accessCode.value = sanitizeAccessCode(refs.accessCode.value);
      });

      refs.accessCode.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          login();
        }
      });

      refs.clearCodeBtn.addEventListener('click', () => {
        refs.accessCode.value = '';
      });

      refs.backspaceCodeBtn.addEventListener('click', () => {
        refs.accessCode.value = refs.accessCode.value.slice(0, -1);
      });

      refs.loginBtn.addEventListener('click', login);
      refs.recoverCodeBtn.addEventListener('click', recoverCode);

      const existingSession = localStorage.getItem('posSession');
      if (existingSession) {
        window.location.href = ordersUrl();
      }

      checkBackendHealth();
      setInterval(checkBackendHealth, 4000);
    </script>
  </body>
</html>
